<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-blade-l" x1="7" y1="29" x2="18" y2="4.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="fav-blade-r" x1="29" y1="29" x2="18" y2="4.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="60%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="fav-orbit" x1="4" y1="20" x2="32" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Left Tapered Blade -->
  <polygon points="18,4.5 7.5,29 11.8,29 18,13.2" stroke="url(#fav-blade-l)" stroke-width="1.3" fill="rgba(0, 240, 255, 0.08)" stroke-linejoin="round" />

  <!-- Right Tapered Blade -->
  <polygon points="18,4.5 28.5,29 24.2,29 18,13.2" stroke="url(#fav-blade-r)" stroke-width="1.3" fill="rgba(168, 85, 247, 0.08)" stroke-linejoin="round" />

  <!-- Orbital Ring -->
  <ellipse cx="18" cy="21" rx="13" ry="4.5" transform="rotate(-14 18 21)" stroke="url(#fav-orbit)" stroke-width="1.3" fill="none" />

  <!-- Central Spark & Apex -->
  <circle cx="18" cy="16.5" r="1.4" fill="#ffffff" />
  <circle cx="18" cy="4.5" r="1.4" fill="#ffffff" />
</svg>
